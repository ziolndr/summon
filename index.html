}

function readSignalCache(provider='guardian'){
  try{
    const raw=localStorage.getItem(signalCacheKey(provider));
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    if(!parsed?.time||!Array.isArray(parsed?.rows))return null;
    if(Date.now()-parsed.time>SIGNAL_CACHE_TTL_MS)return null;
    return parsed.rows;
  }catch(e){return null}
}

function writeSignalCache(rows,provider='guardian'){
  try{
    localStorage.setItem(signalCacheKey(provider),JSON.stringify({time:Date.now(),rows:rows.slice(0,SIGNAL_MAX_CACHE_ROWS)}));
  }catch(e){}
}

function safeReplaceHistory(url){
  try{
    if(location.protocol==='file:')return;
    history.replaceState(null,'',url);
  }catch(e){}
}

function safeSetHash(value){
  if(location.protocol==='file:')return;
  safeReplaceHistory(`#${encodeURIComponent(value)}`);
}

function safeClearHash(){
  if(location.protocol==='file:')return;
  safeReplaceHistory(location.pathname+location.search);
}

function signalFallbackCard(title,section,source,i){
  return fallbackSignalCard(title,section,source,i);
}

function newsApiUnavailableRecord(error){
  const message=String(error?.message||error||'news api unavailable').slice(0,180);
  const title='Signal provider unavailable';
  const section='API';
  const source='Live News Provider';
  const card=signalFallbackCard(title,section,source,0);
  return {
    type:'signal',
    title,
    section,
    year:new Date().getFullYear().toString(),
    source,
    genres:['API','Unavailable'],
    overview:`${title}. ${message}. Signal mode is configured for live geopolitical/news sources and will not substitute fake headlines, stock images, or duplicated filler. Configure NEWS_API_PROXY_URL, GUARDIAN_API_KEY, NEWSDATA_API_KEY, or CURRENTS_API_KEY.`,
    image:card,
    cover:card,
    src:card,
    externalUrl:'https://open-platform.theguardian.com/documentation/'
  };
}

function proxySignalRecord(article,i=0){
  const title=stripHtml(article.title||article.webTitle||article.headline||article.name||'Untitled signal');
  const url=article.url||article.webUrl||article.shortUrl||article.link||article.href||'';
  const rawSection=article.section||article.sectionName||article.category||article.country||article.region||'';
  const section=stripHtml(rawSection||sectionFromSignal(title,url,'News'));
  const source=stripHtml(article.source||article.source_name||article.publication||article.publisher||article.domain||domainFromUrl(url)||'News');
  const date=article.publishedAt||article.pubDate||article.webPublicationDate||article.date||article.published||'';
  const year=formatDateYear(date);
  const summary=stripHtml(article.summary||article.description||article.trailText||article.content||article.bodyText||'');
  const tags=Array.isArray(article.tags)?article.tags.map(t=>typeof t==='string'?t:(t.webTitle||t.name||t.label||'')).filter(Boolean).slice(0,7):[];
  const realImage=normalizeNewsImage(article.image||article.urlToImage||article.thumbnail||article.image_url||article.socialimage||article.imageUrl||article.media);
  const image=realImage||signalFallbackCard(title,section,source,i);
  return {
    type:'signal',title,section,year,source,
    publishedAt:normalizeDate(date),
    genres:tags.length?tags:[section,source].filter(Boolean).slice(0,4),
    overview:`${title}. Source: ${source}. ${year?'Published: '+year+'. ':''}Section: ${section}. ${summary}`.trim(),
    image,cover:image,src:image,
    externalUrl:url
  };
}

function guardianSignalRecord(item,i=0,laneLabel='World'){
  const fields=item.fields||{};
  const title=stripHtml(item.webTitle||item.title||'Untitled signal');
  const url=item.webUrl||fields.shortUrl||'';
  const rawSection=item.sectionName||laneLabel||'World';
  const section=sectionFromSignal(title,url,rawSection);
  const source='The Guardian';
  const date=item.webPublicationDate||fields.lastModified||'';
  const year=formatDateYear(date);
  const tagNames=Array.isArray(item.tags)?item.tags.map(t=>stripHtml(t.webTitle||t.id||'')).filter(Boolean):[];
  const trail=stripHtml(fields.trailText||fields.bodyText||fields.standfirst||'');
  const image=normalizeNewsImage(fields.thumbnail||fields.main||fields.bylineImageUrl)||signalFallbackCard(title,section,source,i);
  return {
    type:'signal',
    title,
    section,
    year,
    source,
    publishedAt:normalizeDate(date),
    genres:[section,...tagNames].filter(Boolean).slice(0,7),
    overview:`${title}. Source: ${source}. ${year?'Published: '+year+'. ':''}Section: ${section}. ${trail}`.trim(),
    image,
    cover:image,
    src:image,
    externalUrl:url
  };
}

function newsDataSignalRecord(article,i=0){
  return proxySignalRecord({
    title:article.title,
    url:article.link,
    image_url:article.image_url,
    description:article.description||article.content,
    pubDate:article.pubDate,
    source_name:article.source_name,
    category:Array.isArray(article.category)?article.category[0]:article.category,
    country:Array.isArray(article.country)?article.country.join(', '):article.country,
    tags:article.keywords||article.category||[]
  },i);
}

async function fetchProxySignals(limit){
  const target=Math.max(1,Number(limit)||signalLimit());
  const pageSize=100;
  const pages=Math.ceil(target/pageSize);
  const basePage=1+Math.abs((corpusPageOffset||0)+(shuffleSeed||0));
  const rows=[];

  for(let page=0;page<pages;page++){
    const p=new URLSearchParams({
      limit:String(Math.min(pageSize,target-rows.length)),
      pageSize:String(pageSize),
      depth:searchDepth,
      page:String(basePage+page),
      vertical:'geopolitics',
      includeImages:'true'
    });
    const res=await fetch(`${NEWS_API_PROXY_URL}${NEWS_API_PROXY_URL.includes('?')?'&':'?'}${p.toString()}`);
    if(!res.ok)throw new Error(`news proxy ${res.status}`);
    const data=await res.json();
    const batch=Array.isArray(data)?data:(data.articles||data.results||data.news||data.items||[]);
    for(const row of batch){
      rows.push(row);
      if(rows.length>=target)break;
    }
    if(rows.length>=target||!batch.length)break;
  }

  return rows.map(proxySignalRecord);
}

async function fetchGuardianSignals(limit){
  const target=Math.max(1,Number(limit)||signalLimit());
  const cached=readSignalCache('guardian');
  if(cached?.length){
    setStatus(`${Math.min(cached.length,target)} cached geopolitical signals`);
    return cached.slice(0,target).map((row,i)=>guardianSignalRecord(row,i,row._laneLabel));
  }

  const laneCount=Math.min(signalDirectLaneCount(),GEOPOLITICAL_SIGNAL_LANES.length);
  const lanes=Array.from({length:laneCount},(_,i)=>GEOPOLITICAL_SIGNAL_LANES[(i+Math.abs(corpusPageOffset+shuffleSeed))%GEOPOLITICAL_SIGNAL_LANES.length]);
  const perLane=Math.max(searchDepth==='archive'?90:searchDepth==='field'?70:30,Math.ceil(target/Math.max(1,lanes.length)));
  const pageSize=50;
  const rows=[];
  const seen=new Set();

  async function pullGuardianPage(params,laneLabel,statusLabel){
    const res=await fetch(`${GUARDIAN_API_URL}?${params.toString()}`);
    if(!res.ok)throw new Error(`guardian ${res.status}`);
    const data=await res.json();
    const results=Array.isArray(data?.response?.results)?data.response.results:[];
    for(const item of results){
      const key=String(item.webUrl||item.webTitle||'').toLowerCase();
      if(!key||seen.has(key))continue;
      seen.add(key);
      rows.push({...item,_laneLabel:laneLabel||statusLabel});
      if(rows.length>=target)break;
    }
    return results.length;
  }

  for(let i=0;i<lanes.length&&rows.length<target;i++){
    const lane=lanes[i];
    const pages=Math.max(1,Math.ceil(perLane/pageSize));
    for(let page=1;page<=pages&&rows.length<target;page++){
      const p=new URLSearchParams({
        'api-key':GUARDIAN_API_KEY,
        'q':lane.q,
        'section':lane.section,
        'order-by':'newest',
        'page-size':String(pageSize),
        'page':String(page),
        'show-fields':'thumbnail,trailText,shortUrl,lastModified,bodyText',
        'show-tags':'keyword',
        'use-date':'published'
      });
      setStatus(`loading ${lane.label.toLowerCase()} signals ${i+1}/${lanes.length} · ${rows.length}/${target}`);
      try{
        const found=await pullGuardianPage(p,lane.label,lane.label);
        if(!found)break;
      }catch(err){
        console.warn('guardian lane skipped',lane.label,err);
        break;
      }
      await new Promise(r=>setTimeout(r,SIGNAL_PROVIDER_DELAY_MS));
    }
  }

  /* Second pass: if the targeted lanes under-fill, sweep broad Guardian sections.
     This keeps signal mode dense without duplicating padding or inventing articles. */
  if(rows.length<target){
    const sweepQuery='geopolitics OR war OR defense OR sanctions OR China OR Taiwan OR Russia OR Ukraine OR Iran OR India OR energy OR cyber OR semiconductors OR climate OR trade';
    const maxSweepPages=searchDepth==='archive'?5:searchDepth==='field'?3:2;
    for(const section of GUARDIAN_SWEEP_SECTIONS){
      for(let page=1;page<=maxSweepPages&&rows.length<target;page++){
        const p=new URLSearchParams({
          'api-key':GUARDIAN_API_KEY,
          'q':sweepQuery,
          'section':section,
          'order-by':'newest',
          'page-size':'50',
          'page':String(page),
          'show-fields':'thumbnail,trailText,shortUrl,lastModified,bodyText',
          'show-tags':'keyword',
          'use-date':'published'
        });
        setStatus(`sweeping ${section} signals · ${rows.length}/${target}`);
        try{
          const found=await pullGuardianPage(p,section,section);
          if(!found)break;
        }catch(err){
          console.warn('guardian sweep skipped',section,err);
          break;
        }
        await new Promise(r=>setTimeout(r,SIGNAL_PROVIDER_DELAY_MS));
      }
      if(rows.length>=target)break;
    }
  }

  if(!rows.length)throw new Error('guardian returned zero articles');
  writeSignalCache(rows,'guardian');
  return rows.slice(0,target).map((row,i)=>guardianSignalRecord(row,i,row._laneLabel));
}

async function fetchNewsDataSignals(limit){
  if(!NEWSDATA_API_KEY)throw new Error('newsdata api key missing');
  const target=Math.max(1,Number(limit)||signalLimit());
  const cached=readSignalCache('newsdata');
  if(cached?.length){
    setStatus(`${Math.min(cached.length,target)} cached newsdata signals`);
    return cached.slice(0,target).map(newsDataSignalRecord);
  }

  const rows=[];
  let pageToken='';
  const query='geopolitics OR defense OR sanctions OR China OR Taiwan OR Russia OR Ukraine OR Iran OR India OR energy security OR semiconductors OR cyber';
  for(let i=0;i<8&&rows.length<target;i++){
    const p=new URLSearchParams({
      apikey:NEWSDATA_API_KEY,
      q:query,
      language:'en',
      category:'politics,business,technology,world',
      image:'1'
    });
    if(pageToken)p.set('page',pageToken);
    setStatus(`loading newsdata signals ${i+1}`);
    const res=await fetch(`${NEWSDATA_API_URL}?${p.toString()}`);
    if(!res.ok)throw new Error(`newsdata ${res.status}`);
    const data=await res.json();
    const batch=Array.isArray(data?.results)?data.results:[];
    rows.push(...batch);
    pageToken=data?.nextPage||'';
    if(!pageToken||!batch.length)break;
  }
  if(!rows.length)throw new Error('newsdata returned zero articles');
  writeSignalCache(rows,'newsdata');
  return rows.slice(0,target).map(newsDataSignalRecord);
}

async function fetchCurrentsSignals(limit){
  if(!CURRENTS_API_KEY)throw new Error('currents api key missing');
  const target=Math.max(1,Number(limit)||signalLimit());
  const cached=readSignalCache('currents');
  if(cached?.length){
    setStatus(`${Math.min(cached.length,target)} cached currents signals`);
    return cached.slice(0,target).map(proxySignalRecord);
  }

  const keyword='geopolitics OR defense OR sanctions OR China OR Taiwan OR Russia OR Ukraine OR Iran OR India OR energy security OR semiconductors OR cyber';
  const pageSize=100;
  const pages=Math.ceil(target/pageSize);
  const rows=[];

  for(let page=1;page<=pages;page++){
    const p=new URLSearchParams({
      keywords:keyword,
      language:'en',
      page_size:String(Math.min(pageSize,target-rows.length)),
      page_number:String(page)
    });
    setStatus(`loading currents signals ${page}/${pages}`);
    const res=await fetch(`${CURRENTS_API_URL}?${p.toString()}`,{
      headers:{Authorization:CURRENTS_API_KEY}
    });
    if(!res.ok)throw new Error(`currents ${res.status}`);
    const data=await res.json();
    const news=Array.isArray(data?.news)?data.news:[];
    rows.push(...news);
    if(rows.length>=target||!news.length)break;
  }

  if(!rows.length)throw new Error('currents returned zero articles');
  writeSignalCache(rows,'currents');
  return rows.slice(0,target).map(proxySignalRecord);
}

function rankSignalRichness(row){
  let score=0;
  if(row.image&&!String(row.image).startsWith('data:image/svg'))score+=6;
  if(row.overview&&row.overview.length>140)score+=2;
  if(row.publishedAt)score+=1;
  if(/world|defense|china|russia|middle east|energy|markets|cyber|supply/i.test(`${row.section} ${(row.genres||[]).join(' ')}`))score+=2;
  return score;
}

async function loadSignals(limit){
  const target=Math.max(1,Number(limit)||signalLimit());
  try{
    setStatus(`loading ${target} geopolitical signals`);
    let rows=[];

    if(NEWS_API_PROXY_URL){
      rows=await fetchProxySignals(target);
    }else if(NEWSDATA_API_KEY){
      rows=await fetchNewsDataSignals(target);
    }else if(CURRENTS_API_KEY){
      rows=await fetchCurrentsSignals(target);
    }else{
      rows=await fetchGuardianSignals(target);
    }

    const seen=new Set(),out=[];
    for(const row of rows){
      const key=String(row.externalUrl||row.title||'').toLowerCase().trim();
      if(!row.title||seen.has(key))continue;
      seen.add(key);
      out.push(row);
    }

    out.sort((a,b)=>{
      const rich=rankSignalRichness(b)-rankSignalRichness(a);
      if(rich)return rich;
      return new Date(b.publishedAt||0)-new Date(a.publishedAt||0);
    });

    if(!out.length)throw new Error('signal provider returned zero articles');
    return out.slice(0,target);
  }catch(e){
    console.error(e);
    setStatus('signal provider unavailable');
    return [newsApiUnavailableRecord(e)];
  }
}

function candidateText(m){
  if(m.type==='signal')return `${m.title}. ${m.section||''}. ${m.source||''}. ${m.overview||''}`;
  if(m.type==='book')return `${m.title}. ${(m.authors||[]).join(', ')}. ${(m.subjects||[]).join(', ')}. ${m.overview||''}`;
  if(m.type==='film')return `${m.title}. ${m.year||''}. ${(m.genres||[]).join(', ')}. ${(m.actors||[]).join(', ')}. ${m.director||''}. ${m.overview||''}`;
  return `${m.title}. ${m.year||''}. ${(m.genres||[]).join(' ')}. ${m.overview||''}`;
}
